version: '3'

# Shortcuts for the build scripts (https://taskfile.dev). Each task runs one
# script; the scripts say what they need.

tasks:
  build:
    summary: Builds the macOS app (bin/native/wtf.app); needs Xcode
    cmds:
      - ./macos/build.sh {{.CLI_ARGS}}

  native:
    summary: Same as build
    cmds:
      - ./macos/build.sh {{.CLI_ARGS}}

  native:test:
    summary: Tests the macOS app's Go side (dispatcher, headless C smoke test) and its Swift core
    cmds:
      - go test ./cmd/libwtf/
      - ./cmd/libwtf/smoke/run.sh
      - cd macos && swift test

  gtk:
    summary: Builds the Linux app (bin/gtk/wtf-gtk) in the dev image (docker build -t wtf-gtk-dev:ubuntu24 linux)
    cmds:
      - ./linux/build.sh

  gtk:check:
    summary: Runs the Linux app's headless checks under Xvfb (after task gtk)
    cmds:
      - ./linux/check.sh

  gtk:package:
    summary: Builds the Linux .deb and .rpm packages (bin/gtk/packages)
    cmds:
      - ./linux/package.sh {{.CLI_ARGS}}

  test:
    summary: Runs the Go tests
    cmds:
      - go vet ./...
      - go test ./...
