name: Notify site

# Rebuild https://koavan.github.io/wtf-terminal-site/ when the manual or version changes.
on:
  push:
    branches: [master]
    paths:
      - "manual/**"
      - "VERSION"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set; skipping." >&2
            exit 1
          fi
          gh api repos/koavan/wtf-terminal-site/dispatches -f event_type=manual-updated
